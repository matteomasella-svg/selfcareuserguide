const state={apartmentId:apartments[0].id, assetIndex:0};
const $=id=>document.getElementById(id);
function apt(){return apartments.find(a=>a.id===state.apartmentId)||apartments[0]}
function asset(){const a=apt(); state.assetIndex=Math.max(0,Math.min(state.assetIndex,a.assets.length-1)); return a.assets[state.assetIndex]}
function esc(v){return String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function list(items){return `<ul>${(items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function programs(arr){return (arr||[]).map(p=>`<div class="program"><h4>${esc(p.name)}</h4><div><strong>Durata:</strong> ${esc(p.duration)}</div><div><strong>Adatto per:</strong> ${esc(p.suitableFor)}</div>${p.notes?`<div><strong>Note:</strong> ${esc(p.notes)}</div>`:''}<div><strong>Avvertenze:</strong></div>${list(p.warnings)}</div>`).join('')}
function renderSelect(){ $('apartmentSelect').innerHTML=apartments.map(a=>`<option value="${a.id}">${esc(a.shortName||a.publicName)}</option>`).join(''); $('apartmentSelect').value=state.apartmentId; }
function renderSummary(){const a=apt(); $('summary').innerHTML=`<b>${esc(a.publicName)}</b><p>${esc(a.address)}</p><p>${esc(a.homepageDescription)}</p><div class="facts"><div class="fact">Piano<strong>${esc(a.floor||'N/D')}</strong></div><div class="fact">Ascensore<strong>${esc(a.elevator||'N/D')}</strong></div><div class="fact">Portineria<strong>${esc(a.doorman||'N/D')}</strong></div><div class="fact">Assistenza<strong>${esc(a.supportPhone||'N/D')}</strong></div></div>`}
function renderRail(){const a=apt(); $('assetRail').innerHTML=a.assets.map((x,i)=>`<button class="assetChip ${i===state.assetIndex?'active':''}" data-i="${i}">${esc(x.item)} <span>${esc(x.id)}</span></button>`).join(''); document.querySelectorAll('.assetChip').forEach(b=>b.onclick=()=>{state.assetIndex=+b.dataset.i; render(); window.scrollTo({top:0,behavior:'smooth'})})}
function euro(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n)}
function kwh(n){return new Intl.NumberFormat('it-IT',{maximumFractionDigits:0}).format(n)+' kWh'}
function tariff(){const el=$('tariffInput'); const v=el?Number(String(el.value).replace(',','.')):0.30; return Number.isFinite(v)&&v>0?v:0.30}
function energyBlock(x){const c=Number(x.consumptionKwhYear||0); const t=tariff(); if(!c){return `<section class="energyPanel"><div class="energyHead"><div><h3>Consumi e costi</h3><small>Dato energetico non disponibile per questo asset</small></div></div><div class="costNote">Quando il consumo kWh/anno non è presente, la scheda mantiene comunque uso, programmi, manutenzione e assistenza.</div></section>`} const yearly=c*t, monthly=yearly/12, daily=yearly/365; return `<section class="energyPanel"><div class="energyHead"><div><h3>Consumo energetico</h3><small>Stima economica con tariffa ${euro(t)}/kWh</small></div></div><div class="energyGrid"><div class="energyBox"><span>Energia annua</span><strong>${kwh(c)}</strong></div><div class="energyBox highlight"><span>Costo annuo</span><strong>${euro(yearly)}</strong></div><div class="energyBox"><span>Costo mensile</span><strong>${euro(monthly)}</strong></div><div class="energyBox"><span>Costo giornaliero</span><strong>${euro(daily)}</strong></div></div><div class="costNote">Valori indicativi: costo = kWh/anno × tariffa. Modifica la tariffa in alto per adattare la stima al contratto reale.</div></section>`}
function renderAsset(){const a=apt(), x=asset(); $('count').textContent=`Asset ${state.assetIndex+1} di ${a.assets.length}`; $('prev').disabled=state.assetIndex===0; $('next').disabled=state.assetIndex===a.assets.length-1; const adv=[['Programmi lavaggio',x.washProgramsDetailed],['Programmi asciugatura',x.dryProgramsDetailed],['Cicli lavastoviglie',x.dishwasherProgramsDetailed]].filter(y=>y[1]&&y[1].length); $('assetView').innerHTML=`
<article class="heroAsset"><div class="kicker">${esc(x.id)} · ${esc(x.category)}</div><div class="assetTitle"><div><h2>${esc(x.item)}</h2><p>${esc(x.brandModel)}</p></div></div><div class="badges"><span class="badge white">${esc(x.category)}</span>${x.purchaseDate?`<span class="badge">Acq. ${esc(x.purchaseDate)}</span>`:''}</div><div class="infoGrid"><div class="infoTile"><span>Modello</span><strong>${esc(x.brandModel)}</strong></div><div class="infoTile"><span>Assistenza</span><strong>${esc(x.assistance||'N/D')}</strong></div></div>${energyBlock(x)}<div class="quickTitle">Uso rapido</div><div class="quick">${(x.quickUse||[]).map((s,i)=>`<div class="q"><span class="num">${i+1}</span><span>${esc(s)}</span></div>`).join('')}</div></article>
<div class="accordion">
<details open><summary>Uso consigliato</summary><div class="body"><p>${esc(x.green||'')}</p>${x.notes?`<p><strong>Nota:</strong> ${esc(x.notes)}</p>`:''}${(x.detailedPrograms||[]).map(t=>`<p>${esc(t)}</p>`).join('')}</div></details>
<details><summary>Programmi disponibili</summary><div class="body"><div class="programPills">${(x.programs||[]).map(p=>`<span>${esc(p)}</span>`).join('')}</div></div></details>
${adv.map(([title,arr])=>`<details><summary>${title}</summary><div class="body">${programs(arr)}</div></details>`).join('')}

<details><summary>Manutenzione</summary><div class="body">${list(x.maintenance)}</div></details>
<details><summary>Scheda asset e assistenza</summary><div class="body"><p><strong>Seriale:</strong> ${esc(x.serial||'N/D')}</p><p><strong>Acquisto:</strong> ${esc(x.purchaseDate||'N/D')}</p><p><strong>Assistenza:</strong> ${esc(x.assistance||'N/D')}</p></div></details>
</div>`}

$('apartmentSelect').onchange=e=>{state.apartmentId=e.target.value;state.assetIndex=0;render()}; $('tariffInput').oninput=()=>renderAsset(); $('infoToggle').onclick=()=>$('summary').classList.toggle('open'); $('prev').onclick=()=>{state.assetIndex--;render();scrollTo({top:0,behavior:'smooth'})}; $('next').onclick=()=>{state.assetIndex++;render();scrollTo({top:0,behavior:'smooth'})}; render();
</script>
